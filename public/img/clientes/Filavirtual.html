<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>www.JatechStore.cl</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--accent:#4f46e5;--track:#e5e7eb;--dot:#c7c9d1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--card:#1c1d21;--text:#f2f2f3;--muted:#9a9aa2;--accent:#818cf8;--track:#2c2d33;--dot:#3a3b42}}
:root[data-theme="dark"]{--bg:#111214;--card:#1c1d21;--text:#f2f2f3;--muted:#9a9aa2;--accent:#818cf8;--track:#2c2d33;--dot:#3a3b42}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);border-radius:16px;padding:32px 28px;max-width:440px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)}
h1{font-size:1.3rem;margin:0 0 6px}
p{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.total{font-size:1rem;margin-bottom:14px}
.total b{color:var(--accent)}
.pos-label{color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}
.pos{font-size:3.6rem;font-weight:700;color:var(--accent);line-height:1.1;margin-bottom:14px}
.line{display:flex;align-items:center;justify-content:center;gap:6px;height:28px;margin-bottom:16px;overflow:hidden}
.d{width:16px;height:16px;border-radius:50%;background:var(--dot);flex:none;transition:opacity .3s}
.d.me{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.d.more{width:auto;background:none;color:var(--muted);font-size:.8rem;border-radius:0}
.time{font-size:.9rem;color:var(--muted)}
.online{margin-top:18px;padding-top:14px;border-top:1px solid var(--track);font-size:.85rem;color:var(--muted)}
button{margin-top:22px;padding:10px 20px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:1rem;cursor:pointer;display:none}
</style>
</head>
<body>
<div class="card">
  <form action="www.jatechstore.cl"></form>
  <h1 id="title">Estás en la fila</h1>
  <p id="msg">Por favor no cierres ni recargues esta página.</p>
  <div class="total">Hay <b id="total">--</b> personas antes que tu</div>
  <div class="pos-label">Tu posición</div>
  <div class="pos" id="pos">--</div>
  <div class="line" id="line"></div>
  <div class="time" id="time"></div>
  <div class="online"><b>Hay más de 1000 personas conectadas en este momento</b></div>
  <div class="online"><b>Tendrás 30 minutos para comprar.</b></div>
  <button id="again">Ingresar</button>
</form>
</div>
<script>
const $ = id => document.getElementById(id);
const randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
let timer;

function drawLine(pos) {
  const ahead = Math.min(pos - 1, 9);
  let h = "";
  if (pos - 1 > ahead) h += '<span class="d more">+' + (pos - 1 - ahead) + '</span>';
  for (let i = 0; i < ahead; i++) h += '<span class="d"></span>';
  h += '<span class="d me" title="Tú"></span>';
  $("line").innerHTML = h;
}

function start() {
  const people = randInt(15, 40);         // personas en la fila (15-40)
  const waitMs = randInt(10000, 20000);   // tiempo de espera (10-20 s)
  const t0 = Date.now();

  // Cada avance ocurre en un momento aleatorio: a veces se mueve de a poco, a veces de golpe
  const times = Array.from({ length: people - 1 }, () => Math.pow(Math.random(), 1.15) * waitMs).sort((a, b) => a - b);

  $("title").textContent = "Estás en la fila";
  $("msg").textContent = "Por favor no cierres ni recargues esta página.";
  $("total").textContent = people;
  $("again").style.display = "none";

  let last = -1;
  clearInterval(timer);
  timer = setInterval(() => {
    const el = Date.now() - t0;
    const done = times.filter(t => t <= el).length;
    const pos = people - done;
    if (pos !== last) { $("pos").textContent = pos; drawLine(pos); last = pos; }
    const rem = Math.max(waitMs - el, 0);
    $("time").textContent = rem > 0 ? "Tiempo estimado: ~" + Math.max(Math.ceil(rem / 1000), 1) + " s" : "";
    if (el >= waitMs) {
      clearInterval(timer);
      $("title").textContent = "¡Es tu turno!";
      $("msg").textContent = "Redirigiendo...";
      $("pos").textContent = "1"; drawLine(1);
      $("time").textContent = "Esperaste " + (waitMs / 1000).toFixed(1) + " s";
      //$("again").style.display = "inline-block";
      setTimeout(() => {
       ir();
     }, 4000);
    }
  }, 150);
}

$("again").addEventListener("click", ir);
start();
function ir(){
window.location.href = "https://www.jatechstore.cl";
}
</script>
</body>
</html>
